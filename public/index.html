<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Quiz Battle</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2e;--mu:#6b6f8a;--ac:#5b3df5;--ac2:#ff4f81;--ok:#16a34a;--bad:#dc2626;--bd:#dfe1ee}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12131f;--card:#1c1e30;--tx:#eef0ff;--mu:#9a9eb8;--ac:#8b78ff;--bd:#2d3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
#app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
button,select,input{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));width:100%}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--ac);color:#fff}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:6px 0;background:var(--bg)}
.lb.me{outline:2px solid var(--ac)}.lb b{flex:1}.lb .pt{font-weight:800}
.code{font-size:40px;letter-spacing:8px;font-weight:900;text-align:center;color:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(150,0,30,.95);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:99;font-size:20px}
.big{font-size:20px;line-height:1.4;margin:0 0 10px}
</style></head><body>
<div id="app"><p class="mu">Connecting…</p></div>
<div id="ov"><div><div style="font-size:60px">🚨</div><p id="ovt"></p><button onclick="document.getElementById('ov').style.display='none'">I understand</button></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={s:null,draft:null,recv:0,key:'',warn:false,qk:'',ws:null,err:''};
let id=localStorage.cqid;if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.cqid=id}
const send=o=>C.ws&&C.ws.readyState===1&&C.ws.send(JSON.stringify(o));
function connect(){
  const ws=C.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send({t:'hello',id,pin:sessionStorage.pin});
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='err'){C.err=m.m;if(m.m==='Wrong host PIN')delete sessionStorage.pin;alert(m.m);return}
    C.s=m;C.recv=performance.now();
    const k=m.phase==='question'?m.qi+':'+m.question.q:'';if(k&&k!==C.qk){C.qk=k;C.draft=null;C.warn=false}
    render()};
  ws.onclose=()=>{$('#app').insertAdjacentHTML('afterbegin','<p class="mu">Reconnecting…</p>');setTimeout(connect,1500)};
}
const lb=()=>{const s=C.s;return s.teams.length?s.teams.map((t,i)=>`<div class="lb ${s.me&&t.code===s.me.code?'me':''}"><span>${['🥇','🥈','🥉'][i]||i+1}</span><b>${esc(t.name)}</b>${s.phase==='reveal'&&t.last!=null?`<span class="mu">+${t.last}</span>`:''}<span class="pt">${t.total}</span></div>`).join(''):'<p class="mu">No teams yet.</p>'};
function render(){
  const s=C.s;if(!s)return;
  const k=s.phase+'|'+s.qi+'|'+(s.me&&s.me.code)+'|'+!!s.mine+'|'+C.warn;
  if(s.phase==='question'&&!s.host){if(k===C.key)return;C.key=k}else C.key='';
  let h='<h1>🔐 Crypto Quiz Battle</h1>';
  if(s.host)h+=hostBar();
  if(s.phase==='lobby')h+=lobby();
  else if(s.phase==='question')h+=question();
  else if(s.phase==='reveal')h+=reveal();
  else h+=`<div class="card"><h2>🏆 Final leaderboard</h2>${lb()}</div>`;
  if(!s.host&&s.phase==='lobby'&&!s.me)h+='<p class="mu"><a href="#" onclick="hostLogin();return false" style="color:var(--mu)">Teacher login</a></p>';
  $('#app').innerHTML=h;
}
function hostLogin(){const p=prompt('Teacher PIN (shown in the server console)');if(p){sessionStorage.pin=p;send({t:'hello',id,pin:p})}}
function hostBar(){const s=C.s;let b='';
  if(s.phase==='lobby')b=`<button onclick="send({t:'start'})" ${s.teams.length?'':'disabled'}>▶ Start game</button>`;
  if(s.phase==='question')b=`<span>Answered <b>${s.answered}/${s.teams.length}</b></span><button class="sec" onclick="send({t:'reveal'})">Reveal now</button>`;
  if(s.phase==='reveal')b=s.qi+1<s.n?`<button onclick="send({t:'next'})">Next question ▶</button>`:`<button onclick="send({t:'finish'})">🏁 Finish</button>`;
  return `<div class="card"><span class="tag">TEACHER</span> ${s.teams.length} teams<div class="row" style="margin-top:10px">${b}<button class="sec" onclick="if(confirm('Delete all teams and scores?'))send({t:'reset'})">New game</button></div></div>`}
function lobby(){const s=C.s;
  if(s.host)return `<div class="card"><h2>Teams</h2>${s.teams.map(t=>`<div class="lb"><b>${esc(t.name)}</b><span class="mu">code <b>${t.code}</b></span><span class="pt">${t.size}/5</span></div>`).join('')||'<p class="mu">Waiting for students…</p>'}</div>`;
  if(s.me){const t=s.teams.find(t=>t.code===s.me.code);return `<div class="card"><h2>Team ${esc(t.name)}</h2><p class="mu">Share this code with up to 4 teammates:</p><div class="code">${s.me.code}</div><p>${t.members.map(esc).join(' · ')} (${t.size}/5)${s.me.leader?'<br>👑 You are the team leader.':''}</p><p class="mu">Waiting for the teacher to start…</p></div>`}
  return `<div class="card"><h2>Join the battle</h2><input id="nm" maxlength="20" placeholder="Your name"></div>
  <div class="card"><b>👑 Team leader</b><p class="mu">Create a team. Only you will submit answers.</p><input id="tn" maxlength="20" placeholder="Team name"><button onclick="send({t:'create',name:$('#nm').value,team:$('#tn').value})">Create team</button></div>
  <div class="card"><b>🙋 Team member</b><input id="jc" maxlength="4" placeholder="4-letter team code" style="text-transform:uppercase"><button onclick="send({t:'join',name:$('#nm').value,code:$('#jc').value})">Join team</button></div>`}
function inert(q){return q.o?q.o.map(o=>`<div class="opt" style="pointer-events:none">${esc(o)}</div>`).join(''):`<p>${q.l.map(esc).join(', ')}</p><p class="mu">${q.r.map(esc).join(' | ')}</p>`}
function question(){const s=C.s,q=s.question,icon={odd:'🕵️',match:'🔗',num:'🔢',mcq:'❓'}[q.t];
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">Q${s.qi+1}/${s.n} · ${esc(q.tp)}</span><b id="tm">${Math.ceil(s.left/1000)}s</b></div><div class="bar"><i id="tb"></i></div><p class="big">${icon} ${esc(q.q)}</p>`;
  if(s.host)return h+inert(q)+'</div>';
  if(!s.me)return h+'<p class="mu">You are not in a team. Watch the leaderboard!</p></div>';
  if(s.mine)return h+`<p>🔒 <b>Answer locked</b> in ${(s.mine.ms/1000).toFixed(1)}s. Waiting for results…</p></div>`;
  if(!s.me.leader)return h+inert(q)+'<p class="mu">💬 Discuss with your team. Only the leader submits.</p></div>';
  const d=C.draft;
  if(q.o)h+=q.o.map((o,i)=>`<button class="opt ${d===i?'sel':''}" onclick="C.draft=${i};C.key='';render()">${esc(o)}</button>`).join('');
  if(q.t==='num')h+=`<input id="nv" type="number" step="any" inputmode="decimal" placeholder="Your answer" value="${d??''}" oninput="C.draft=this.value">`;
  if(q.t==='match')h+=q.l.map((x,i)=>`<div><b>${esc(x)}</b><select onchange="C.draft=C.draft||[];C.draft[${i}]=this.value"><option value="">Choose…</option>${q.r.map((r,j)=>`<option value="${j}" ${d&&d[i]==j?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  return h+`<button style="width:100%;margin-top:10px" onclick="lock()">🔒 Lock in answer</button></div>`}
function lock(){const q=C.s.question,d=C.draft;
  if(d==null||d===''||q.t==='match'&&(!Array.isArray(d)||d.length<q.l.length||[...d].some(x=>x===undefined||x==='')))return alert('Answer everything first.');
  send({t:'answer',ans:q.t==='match'?d.join(','):String(d)})}
function reveal(){const s=C.s,q=s.question,mine=s.me&&s.teams.find(t=>t.code===s.me.code);
  return `<div class="card"><span class="tag">Q${s.qi+1} answer</span><p class="big">${esc(q.q)}</p><p><b style="color:var(--ok)">✔ ${esc(s.key).replace(/\n/g,'<br>')}</b></p>
  ${s.me?`<p>${s.mine?(s.mine.ok?'✅ Correct in '+(s.mine.ms/1000).toFixed(1)+'s':'❌ Not correct'):'⏰ No answer submitted'} · <b>+${mine?mine.last:0} pts</b></p>`:''}</div>
  <div class="card"><h2>🏅 Leaderboard</h2>${lb()}</div>`}
setInterval(()=>{const s=C.s;if(!s||s.phase!=='question')return;const left=Math.max(0,s.left-(performance.now()-C.recv)),tm=$('#tm'),tb=$('#tb');
  if(tm)tm.textContent=Math.ceil(left/1000)+'s';if(tb)tb.style.width=(left/(s.question.s*10))+'%'},250);

// ---- anti-cheat (deterrent) ----
const flag=why=>{const s=C.s;if(!s||s.host||s.phase!=='question'||!s.me)return;C.warn=true;$('#ovt').textContent=why+' Your team loses 150 pts on this question.';$('#ov').style.display='flex';send({t:'flag'})};
['copy','cut','paste','contextmenu','dragstart'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('selectstart',ev=>{if(!/INPUT|SELECT/.test(ev.target.tagName||''))ev.preventDefault()});
document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase(),m=ev.ctrlKey||ev.metaKey;
  if(k==='f12'||m&&ev.shiftKey&&'ijckn'.includes(k)||m&&'cvxausp'.includes(k))ev.preventDefault()},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flag('Tab switch detected.')});
window.addEventListener('blur',()=>setTimeout(()=>{if(!document.hasFocus()&&!document.hidden)flag('You left the quiz window.')},300));
setInterval(()=>{if(innerWidth<700)return;if(outerWidth-innerWidth>200||outerHeight-innerHeight>260)flag('Developer tools detected.')},1500);
connect();
</script></body></html>
